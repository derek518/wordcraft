[package]
name = "wordcraft"
version = "0.1.0"
description = "WordCraft - 游戏化单词记忆软件"
authors = ["WordCraft Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2.5.1"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
lettre = { version = "0.11.19", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_Shell", "Win32_Foundation"] }
